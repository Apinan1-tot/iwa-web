<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด | IWA RICH YOU D Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body data-page="dashboard">
<div class="a-shell">
  <aside class="a-sidebar">
    <div class="a-sidebar__brand">IWA RICH YOU D<small>ADMIN PANEL</small></div>
    <a href="dashboard.html" data-nav="dashboard">📊 แดชบอร์ด</a>
    <a href="products.html" data-nav="products">📦 สินค้า</a>
    <a href="categories.html" data-nav="categories">🗂️ หมวดหมู่</a>
    <a href="activity-log.html" data-nav="activity-log">🕓 ประวัติการแก้ไข</a>
    <a href="account.html" data-nav="account">👤 บัญชีผู้ใช้</a>
    <a href="../" target="_blank">🔗 ดูเว็บไซต์จริง</a>
    <div class="a-sidebar__spacer"></div>
    <a class="a-sidebar__logout" data-logout href="#">ออกจากระบบ</a>
  </aside>
  <main class="a-main">
    <div class="a-topbar">
      <div><h1>สวัสดีครับ, <span data-admin-username>…</span></h1><p>ภาพรวมข้อมูลสินค้าและหมวดหมู่บนเว็บไซต์</p></div>
      <a class="a-btn a-btn-primary" href="product-form.html">+ เพิ่มสินค้าใหม่</a>
    </div>
    <div class="a-grid-stats" id="stats-grid">
      <div class="a-stat"><b>–</b><span>สินค้าทั้งหมด</span></div>
      <div class="a-stat"><b>–</b><span>สินค้าที่แสดงผล</span></div>
      <div class="a-stat"><b>–</b><span>หมวดหมู่ทั้งหมด</span></div>
    </div>
    <div class="a-card">
      <h2 style="margin-top:0">สินค้าล่าสุด</h2>
      <table id="recent-table">
        <thead><tr><th>รูป</th><th>ชื่อสินค้า</th><th>หมวดหมู่</th><th>สถานะ</th><th></th></tr></thead>
        <tbody><tr><td colspan="5" class="a-empty">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="admin-shared.js"></script>
<script>
  (async function () {
    await Admin.guard();
    Admin.bindLogout();
    Admin.setActiveNav();
    try {
      const [products, categories] = await Promise.all([Admin.api('/products'), Admin.api('/categories')]);
      const published = products.filter((p) => p.is_published).length;
      document.getElementById('stats-grid').innerHTML = `
        <div class="a-stat"><b>${products.length}</b><span>สินค้าทั้งหมด</span></div>
        <div class="a-stat"><b>${published}</b><span>สินค้าที่แสดงผล</span></div>
        <div class="a-stat"><b>${categories.length}</b><span>หมวดหมู่ทั้งหมด</span></div>`;
      const recent = products.slice(0, 8);
      const tbody = document.querySelector('#recent-table tbody');
      tbody.innerHTML = recent.length ? recent.map((p) => `
        <tr>
          <td><img class="a-thumb" src="${Admin.escapeHtml(p.image || '')}" onerror="this.style.visibility='hidden'"></td>
          <td>${Admin.escapeHtml(p.name)}</td>
          <td>${Admin.escapeHtml(p.category_name || '')}</td>
          <td><span class="a-badge ${p.is_published ? 'a-badge-on' : 'a-badge-off'}">${p.is_published ? 'แสดงผล' : 'ซ่อนอยู่'}</span></td>
          <td><a class="a-btn a-btn-outline a-btn-sm" href="product-form.html?id=${p.id}">แก้ไข</a></td>
        </tr>`).join('') : '<tr><td colspan="5" class="a-empty">ยังไม่มีสินค้า</td></tr>';
    } catch (err) {
      Admin.toast(err.message, 'error');
    }
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สินค้า | IWA RICH YOU D Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body data-page="products">
<div class="a-shell">
  <aside class="a-sidebar">
    <div class="a-sidebar__brand">IWA RICH YOU D<small>ADMIN PANEL</small></div>
    <a href="dashboard.html" data-nav="dashboard">📊 แดชบอร์ด</a>
    <a href="products.html" data-nav="products">📦 สินค้า</a>
    <a href="categories.html" data-nav="categories">🗂️ หมวดหมู่</a>
    <a href="account.html" data-nav="account">👤 บัญชีผู้ใช้</a>
    <a href="../" target="_blank">🔗 ดูเว็บไซต์จริง</a>
    <div class="a-sidebar__spacer"></div>
    <a class="a-sidebar__logout" data-logout href="#">ออกจากระบบ</a>
  </aside>
  <main class="a-main">
    <div class="a-topbar">
      <div><h1>สินค้าทั้งหมด</h1><p>เพิ่ม แก้ไข หรือลบสินค้า — การเปลี่ยนแปลงจะแสดงผลบนเว็บไซต์ทันที</p></div>
      <a class="a-btn a-btn-primary" href="product-form.html">+ เพิ่มสินค้าใหม่</a>
    </div>
    <div class="a-card">
      <div class="a-filter-bar">
        <input type="text" class="a-search" id="search" placeholder="ค้นหาชื่อสินค้า...">
        <select id="category-filter" style="max-width:220px">
          <option value="">ทุกหมวดหมู่</option>
        </select>
      </div>
      <table>
        <thead><tr><th>รูป</th><th>ชื่อสินค้า</th><th>หมวดหมู่</th><th>สถานะ</th><th style="text-align:right">จัดการ</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="a-empty">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="admin-shared.js"></script>
<script>
  let allProducts = [];
  let allCategories = [];

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const catId = document.getElementById('category-filter').value;
    const rows = allProducts.filter((p) => {
      const matchesQ = !q || p.name.toLowerCase().includes(q);
      const matchesCat = !catId || String(p.category_id) === catId;
      return matchesQ && matchesCat;
    });
    const tbody = document.getElementById('rows');
    tbody.innerHTML = rows.length ? rows.map((p) => `
      <tr>
        <td><img class="a-thumb" src="${Admin.escapeHtml(p.image || '')}" onerror="this.style.visibility='hidden'"></td>
        <td><strong>${Admin.escapeHtml(p.name)}</strong><div style="color:#8f8573;font-size:12.5px">${Admin.escapeHtml(p.summary || '').slice(0, 60)}</div></td>
        <td>${Admin.escapeHtml(p.category_name || '')}</td>
        <td><span class="a-badge ${p.is_published ? 'a-badge-on' : 'a-badge-off'}" style="cursor:pointer" data-toggle="${p.id}">${p.is_published ? 'แสดงผล' : 'ซ่อนอยู่'}</span></td>
        <td style="text-align:right">
          <div class="a-actions-row" style="justify-content:flex-end">
            <a class="a-btn a-btn-outline a-btn-sm" href="product-form.html?id=${p.id}">แก้ไข</a>
            <button class="a-btn a-btn-danger a-btn-sm" data-delete="${p.id}">ลบ</button>
          </div>
        </td>
      </tr>`).join('') : '<tr><td colspan="5" class="a-empty">ไม่พบสินค้า</td></tr>';

    tbody.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', async () => {
        const id = el.getAttribute('data-toggle');
        const product = allProducts.find((p) => p.id == id);
        try {
          await Admin.api(`/products/${id}`, { method: 'PUT', body: { is_published: !product.is_published } });
          product.is_published = product.is_published ? 0 : 1;
          render();
          Admin.toast('อัปเดตสถานะเรียบร้อย');
        } catch (err) { Admin.toast(err.message, 'error'); }
      });
    });
    tbody.querySelectorAll('[data-delete]').forEach((el) => {
      el.addEventListener('click', async () => {
        const id = el.getAttribute('data-delete');
        const product = allProducts.find((p) => p.id == id);
        if (!confirm(`ยืนยันลบสินค้า "${product.name}" ? การลบไม่สามารถย้อนกลับได้`)) return;
        try {
          await Admin.api(`/products/${id}`, { method: 'DELETE' });
          allProducts = allProducts.filter((p) => p.id != id);
          render();
          Admin.toast('ลบสินค้าเรียบร้อย');
        } catch (err) { Admin.toast(err.message, 'error'); }
      });
    });
  }

  (async function () {
    await Admin.guard();
    Admin.bindLogout();
    Admin.setActiveNav();
    try {
      [allProducts, allCategories] = await Promise.all([Admin.api('/products'), Admin.api('/categories')]);
      const filter = document.getElementById('category-filter');
      allCategories.forEach((c) => {
        const opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.name;
        filter.appendChild(opt);
      });
      render();
      document.getElementById('search').addEventListener('input', render);
      filter.addEventListener('change', render);
    } catch (err) {
      Admin.toast(err.message, 'error');
    }
  })();
</script>
</body>
</html>

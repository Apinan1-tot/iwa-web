<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หมวดสินค้า | IWA RICH YOU D</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/catalog-pages.css">
</head>
<body class="catalog-page">
  <header class="catalog-page__header">
    <div class="catalog-page__bar">
      <a class="catalog-page__brand" href="../"><img src="../assets/img/logo.png" alt="IWA RICH YOU D"><span>IWA RICH YOU D CO.,LTD.<small>ICT SOLUTIONS · DIGITAL LEARNING</small></span></a>
      <a class="catalog-page__back" href="index.html">← ทุกหมวดหมู่</a>
    </div>
  </header>
  <main>
    <section class="catalog-page__hero">
      <div class="catalog-page__hero-inner">
        <div class="catalog-page__crumb"><a href="../">หน้าแรก</a><span>/</span><a href="index.html">สินค้า</a><span>/</span><span data-cat-crumb>หมวดสินค้า</span></div>
        <span class="catalog-page__eyebrow" data-cat-eyebrow>PRODUCTS</span>
        <h1 data-cat-title>กำลังโหลด...</h1>
        <p data-cat-desc></p>
      </div>
    </section>
    <section class="catalog-page__content">
      <div class="catalog-page__heading"><div><h2>รายการสินค้า</h2><p>เลือกดูภาพและข้อมูลสรุปของแต่ละผลิตภัณฑ์ได้</p></div><span class="catalog-page__count" data-cat-count>กำลังโหลด...</span></div>
      <div class="demo-product-grid" data-product-grid></div>
    </section>
  </main>
  <footer class="catalog-page__footer">© 2026 IWA RICH YOU D CO.,LTD. · <a href="../#contact">ติดต่อเรา</a></footer>
  <script>
    // Reads ?slug=xxx from the URL and hands it to the shared category-loader.js
    // via the same data-category attribute the named category pages use —
    // this is what lets ANY category (including brand-new ones added in the
    // admin panel) get a working page instantly, with zero new files needed.
    (function () {
      const slug = new URLSearchParams(location.search).get('slug');
      if (slug) document.body.setAttribute('data-category', slug);
      else document.querySelector('[data-cat-title]').textContent = 'ไม่พบหมวดสินค้าที่ต้องการ';
    })();
  </script>
  <script src="../assets/js/category-loader.js"></script>
  <script defer src="../assets/js/motion.js"></script>
</body>
</html>

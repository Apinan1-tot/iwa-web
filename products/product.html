<body class="catalog-page product-detail-page">
  <header class="catalog-page__header">
    <div class="catalog-page__bar">
      <a class="catalog-page__brand" href="../"><img src="../assets/img/logo.png" alt="IWA RICH YOU D"><span>IWA RICH YOU D CO.,LTD.<small>ICT SOLUTIONS · DIGITAL LEARNING</small></span></a>
